<head>

    <title>Tugas CSS 1</title>
    <!-- internal CSS -->
    <style>
        /* setiap elemen 2 warnanya biru font size 50px */
        h2 {
            color:blue;

        /* untuk class judul warnanya merah font size 30px */

            color: red;

        }

</head>

    <h2>  Umur Saya 20 Tahun</h2>
    <p class="judul">lore ipsum dolor sit amet</p>
